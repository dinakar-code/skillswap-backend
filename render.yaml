services:
  - type: web
    name: skillswap-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: com.mysql.cj.jdbc.Driver
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: SPRING_SECURITY_JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://skillswap-frontend-gamma.vercel.app
