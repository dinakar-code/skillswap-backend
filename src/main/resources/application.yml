spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:skillswap;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET:change-this-secret-key-for-production-and-use-32-bytes}
      expiration-ms: 86400000

app:
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
